<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nappy Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
  <script src="/static/vendor/prop-types.min.js"></script>
  <script src="/static/vendor/Recharts.js"></script>
  <script src="/static/vendor/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, Legend } = Recharts;

    const API = "/api";

    const RETAILERS = ["Woolworths", "Pak'nSave", "New World", "The Warehouse", "Chemist Warehouse"];
    const RETAILER_COLORS = {
      "Woolworths": "#00AA46",
      "Pak'nSave": "#FFD000",
      "New World": "#E31837",
      "The Warehouse": "#CC0000",
      "Chemist Warehouse": "#005BAA",
    };

    const fmt = (n) => n != null ? `$${n.toFixed(2)}` : "—";
    const fmtUnit = (n) => n != null ? `${(n * 100).toFixed(1)}¢` : "—";
    const unitPrice = (price, count) => price != null && count ? price / count : null;

    const css = `
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: linear-gradient(155deg, #fef7ff 0%, #f0f4ff 60%, #f0fdf4 100%); min-height: 100vh; color: #3d1e5a; font-family: 'Nunito', sans-serif; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f5f3ff; }
      ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 6px; }
      .app { min-height: 100vh; padding: 32px 24px; max-width: 1100px; margin: 0 auto; }
      .header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1.5px solid #ede9fe; flex-wrap: wrap; }
      .header h1 { font-size: 26px; font-weight: 800; color: #3d1e5a; letter-spacing: -0.3px; }
      .header .sub { font-size: 12px; color: #a78bfa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
      .size-tabs { display: flex; gap: 6px; }
      .size-tab { padding: 7px 18px; border: 1.5px solid #ede9fe; background: #fff; color: #a78bfa; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 20px; transition: all 0.15s; }
      .size-tab.active { background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(124,58,237,0.22); }
      .size-tab:hover:not(.active) { border-color: #c4b5fd; color: #7c3aed; }
      .btn { padding: 9px 18px; border: 1.5px solid #ede9fe; background: #fff; color: #6d4d7e; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 14px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
      .btn:hover { border-color: #c4b5fd; color: #7c3aed; background: #faf9ff; }
      .btn.primary { background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(124,58,237,0.22); }
      .btn.primary:hover { box-shadow: 0 6px 20px rgba(124,58,237,0.32); transform: translateY(-1px); }
      .btn.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      .btn.danger { color: #f43f5e; border-color: #fecdd3; background: #fff; }
      .btn.danger:hover { background: #fff1f2; border-color: #fda4af; }
      .btn.sm { padding: 5px 12px; font-size: 12px; border-radius: 10px; }
      .spacer { flex: 1; }
      .product-sections { display: grid; gap: 24px; }
      .section { background: #fff; border: 1.5px solid #ede9fe; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(124,58,237,0.06); }
      .section-header { padding: 18px 22px; border-bottom: 1.5px solid #f5f3ff; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .section-title { font-size: 15px; font-weight: 800; color: #3d1e5a; }
      .section-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 700; flex-shrink: 0; }
      .badge-pants { background: #eff6ff; color: #3b82f6; border: 1.5px solid #bfdbfe; }
      .badge-nappies { background: #f5f3ff; color: #7c3aed; border: 1.5px solid #ddd6fe; }
      .best-deal { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a78bfa; font-weight: 700; flex-wrap: wrap; }
      .best-deal strong { color: #16a34a; font-size: 14px; }
      .price-table { width: 100%; border-collapse: collapse; }
      .price-table th { padding: 10px 18px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #a78bfa; font-weight: 700; border-bottom: 1.5px solid #f5f3ff; }
      .price-table td { padding: 13px 18px; font-size: 13px; border-bottom: 1px solid #faf9ff; vertical-align: middle; color: #3d1e5a; }
      .price-table tr:last-child td { border-bottom: none; }
      .price-table tr.oos td { opacity: 0.4; }
      .price-table tr.best-row td { background: #f0fdf4; }
      .price-table tr:hover:not(.oos) td { background: #faf9ff; }
      .retailer-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
      .retailer-cell { display: flex; align-items: center; font-weight: 700; }
      .retailer-cell a { color: inherit; text-decoration: none; }
      .retailer-cell a:hover { text-decoration: underline; text-underline-offset: 3px; }
      .unit-price { font-size: 16px; font-weight: 800; color: #6d4d7e; }
      .unit-price.best { color: #16a34a; }
      .pack-price { font-size: 11px; color: #a78bfa; margin-top: 2px; font-weight: 600; }
      .pack-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; background: #f5f3ff; color: #7c3aed; border: 1.5px solid #ede9fe; font-weight: 700; }
      .oos-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10px; background: #fff1f2; color: #f43f5e; border: 1.5px solid #fecdd3; text-transform: uppercase; letter-spacing: 0.05em; margin-left: 6px; font-weight: 700; }
      .club-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10px; background: #fefce8; color: #a16207; border: 1.5px solid #fde68a; font-weight: 700; margin-left: 6px; }
      .error-badge { font-size: 11px; color: #fca5a5; font-weight: 600; }
      .scraped-at { font-size: 11px; color: #c4b5fd; font-weight: 600; }
      .chart-section { padding: 20px 22px; border-top: 1.5px solid #f5f3ff; background: #fdfcff; }
      .chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #a78bfa; font-weight: 700; margin-bottom: 16px; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(61,30,90,0.3); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
      .modal { background: #fff; border: 1.5px solid #ede9fe; border-radius: 20px; padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(124,58,237,0.15); }
      .modal h2 { font-size: 18px; font-weight: 800; color: #3d1e5a; margin-bottom: 22px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
      .form-grid .full { grid-column: 1 / -1; }
      .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #a78bfa; font-weight: 700; margin-bottom: 6px; }
      .field input, .field select { width: 100%; background: #faf9ff; border: 1.5px solid #ede9fe; border-radius: 12px; padding: 9px 12px; color: #3d1e5a; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600; }
      .field input:focus, .field select:focus { outline: none; border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,0.12); background: #fff; }
      .field select option { background: #fff; color: #3d1e5a; }
      .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
      .config-table { width: 100%; border-collapse: collapse; }
      .config-table th { padding: 8px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #a78bfa; font-weight: 700; border-bottom: 1.5px solid #f5f3ff; }
      .config-table td { padding: 10px 14px; font-size: 12px; border-bottom: 1px solid #faf9ff; color: #6d4d7e; font-weight: 600; }
      .url-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c4b5fd; font-size: 11px; display: block; }
      .toast { position: fixed; bottom: 24px; right: 24px; background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #16a34a; padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 700; z-index: 200; animation: slideIn 0.2s ease; box-shadow: 0 4px 16px rgba(22,163,74,0.15); }
      .toast.error { background: #fff1f2; border-color: #fecdd3; color: #f43f5e; box-shadow: 0 4px 16px rgba(244,63,94,0.12); }
      @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .dot-pulse { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; display: inline-block; animation: pulse 1s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .scraping-row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #a78bfa; padding: 12px 18px; font-weight: 600; }
      .empty-state { padding: 48px; text-align: center; color: #c4b5fd; font-size: 13px; font-weight: 600; }
      .backend-banner { background: #fff7ed; border: 1.5px solid #fed7aa; border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; font-size: 12px; color: #92400e; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    `;

    const styleEl = document.createElement("style");
    styleEl.textContent = css;
    document.head.appendChild(styleEl);
    document.body.style.margin = "0";

    function fmtDate(iso) {
      if (!iso) return "never";
      const d = new Date(iso);
      return d.toLocaleDateString("en-NZ", { day: "numeric", month: "short" }) +
        " " + d.toLocaleTimeString("en-NZ", { hour: "2-digit", minute: "2-digit" });
    }

    function Toast({ msg, type, onDone }) {
      useEffect(() => { const t = setTimeout(onDone, 3500); return () => clearTimeout(t); }, [onDone]);
      return <div className={`toast ${type === "error" ? "error" : ""}`}>{msg}</div>;
    }

    function AddVariantModal({ onClose, onSave, currentSize }) {
      const [form, setForm] = useState({ retailer: RETAILERS[0], product_type: "pants", size: currentSize, pack_count: "", url: "", notes: "" });
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const save = async () => {
        if (!form.pack_count || !form.url) return;
        await onSave({ ...form, size: parseInt(form.size), pack_count: parseInt(form.pack_count) });
        onClose();
      };
      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal">
            <h2>Add Variant</h2>
            <div className="form-grid">
              <div className="field"><label>Retailer</label>
                <select value={form.retailer} onChange={e => set("retailer", e.target.value)}>
                  {RETAILERS.map(r => <option key={r}>{r}</option>)}
                </select>
              </div>
              <div className="field"><label>Product</label>
                <select value={form.product_type} onChange={e => set("product_type", e.target.value)}>
                  <option value="pants">Nappy Pants</option>
                  <option value="nappies">Nappies</option>
                </select>
              </div>
              <div className="field"><label>Size</label>
                <input type="number" value={form.size} onChange={e => set("size", e.target.value)} min={4} max={7} />
              </div>
              <div className="field"><label>Pack Count</label>
                <input type="number" value={form.pack_count} onChange={e => set("pack_count", e.target.value)} placeholder="e.g. 96" />
              </div>
              <div className="field full"><label>Product URL</label>
                <input type="url" value={form.url} onChange={e => set("url", e.target.value)} placeholder="https://..." />
              </div>
              <div className="field full"><label>Notes (optional)</label>
                <input type="text" value={form.notes} onChange={e => set("notes", e.target.value)} placeholder="e.g. boxed bulk pack" />
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn" onClick={onClose}>Cancel</button>
              <button className="btn primary" onClick={save} disabled={!form.pack_count || !form.url}>Add</button>
            </div>
          </div>
        </div>
      );
    }

    function ConfigModal({ variants, onClose, onDelete, onUpdate }) {
      const [editing, setEditing] = useState(null);
      const [editUrl, setEditUrl] = useState("");
      const [editCount, setEditCount] = useState("");
      const startEdit = (v) => { setEditing(v.id); setEditUrl(v.url); setEditCount(v.pack_count); };
      const saveEdit = async (id) => { await onUpdate(id, { url: editUrl, pack_count: parseInt(editCount) }); setEditing(null); };
      const inp = { background: "#0d0d0d", border: "1px solid #333", color: "#e8e4dc", padding: "2px 6px", borderRadius: 2, fontFamily: "DM Mono, monospace", fontSize: 11 };
      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal" style={{ maxWidth: 820 }}>
            <h2>Configure Variants</h2>
            <div style={{ overflowX: "auto", marginBottom: 16 }}>
              <table className="config-table">
                <thead><tr><th>Retailer</th><th>Product</th><th>Sz</th><th>Pack</th><th>URL</th><th></th></tr></thead>
                <tbody>
                  {variants.map(v => (
                    <tr key={v.id}>
                      <td>{v.retailer}</td>
                      <td>{v.product_type === "pants" ? "Pants" : "Nappies"}</td>
                      <td>{v.size}</td>
                      <td>{editing === v.id ? <input style={{ ...inp, width: 55 }} value={editCount} onChange={e => setEditCount(e.target.value)} /> : `${v.pack_count}pk`}</td>
                      <td>{editing === v.id
                        ? <input style={{ ...inp, width: 300 }} value={editUrl} onChange={e => setEditUrl(e.target.value)} />
                        : <span className="url-cell" title={v.url}>{v.url}</span>}
                      </td>
                      <td style={{ whiteSpace: "nowrap" }}>
                        {editing === v.id
                          ? <><button className="btn sm" onClick={() => saveEdit(v.id)}>Save</button><button className="btn sm" onClick={() => setEditing(null)} style={{ marginLeft: 4 }}>✕</button></>
                          : <><button className="btn sm" onClick={() => startEdit(v)}>Edit</button><button className="btn sm danger" onClick={() => onDelete(v.id)} style={{ marginLeft: 4 }}>Del</button></>
                        }
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="modal-actions"><button className="btn primary" onClick={onClose}>Done</button></div>
          </div>
        </div>
      );
    }

    function PriceTable({ rows, scraping }) {
      if (!rows.length) return <div className="empty-state">No variants configured for this size.</div>;
      const inStock = rows.filter(r => r.in_stock && r.price != null);
      const bestUP = inStock.length ? Math.min(...inStock.map(r => unitPrice(r.price, r.pack_count))) : null;
      const sorted = [...rows].sort((a, b) => {
        const ua = unitPrice(a.price, a.pack_count), ub = unitPrice(b.price, b.pack_count);
        if (!a.in_stock && b.in_stock) return 1;
        if (a.in_stock && !b.in_stock) return -1;
        if (ua == null) return 1; if (ub == null) return -1;
        return ua - ub;
      });
      return (
        <table className="price-table">
          <thead><tr><th>Retailer</th><th>Pack</th><th>Per nappy</th><th>Pack price</th><th>Checked</th></tr></thead>
          <tbody>
            {sorted.map(row => {
              const up = unitPrice(row.price, row.pack_count);
              const isBest = up != null && up === bestUP && row.in_stock;
              const isOos = !row.in_stock || row.price == null;
              return (
                <tr key={row.id} className={`${isOos ? "oos" : ""} ${isBest ? "best-row" : ""}`}>
                  <td><div className="retailer-cell"><span className="retailer-dot" style={{ background: RETAILER_COLORS[row.retailer] || "#555" }} /><a href={row.url} target="_blank" rel="noreferrer">{row.retailer}</a></div></td>
                  <td>
                    <span className="pack-badge">{row.pack_count}pk</span>
                    {row.is_club ? <span className="club-badge">Club</span> : null}
                    {isOos && <span className="oos-badge">{row.error === "URL not configured" ? "no url" : "OOS"}</span>}
                  </td>
                  <td>
                    {!isOos && <span className={`unit-price ${isBest ? "best" : ""}`}>{isBest && "★ "}{fmtUnit(up)}</span>}
                    {row.error && !row.price && <span className="error-badge">{row.error}</span>}
                  </td>
                  <td>{!isOos ? <><span style={{ fontSize: 13 }}>{fmt(row.price)}</span>{row.notes && <div className="pack-price">{row.notes}</div>}</> : "—"}</td>
                  <td><span className="scraped-at">{fmtDate(row.scraped_at)}</span></td>
                </tr>
              );
            })}
            {scraping && <tr><td colSpan={5}><div className="scraping-row"><div className="dot-pulse" />Fetching latest prices…</div></td></tr>}
          </tbody>
        </table>
      );
    }

    function TrendChart({ history, productType, size }) {
      const relevant = history.filter(h => h.product_type === productType && h.size === size && h.price != null && h.in_stock);
      if (relevant.length < 2) return null;
      const byDateRetailer = {};
      relevant.forEach(h => {
        const date = h.scraped_at.slice(0, 10);
        if (!byDateRetailer[date]) byDateRetailer[date] = {};
        const up = unitPrice(h.price, h.pack_count);
        if (byDateRetailer[date][h.retailer] == null || up < byDateRetailer[date][h.retailer]) byDateRetailer[date][h.retailer] = up;
      });
      const dates = Object.keys(byDateRetailer).sort();
      const retailers = [...new Set(relevant.map(h => h.retailer))];
      const chartData = dates.map(date => ({
        date,
        ...Object.fromEntries(retailers.map(r => [r, byDateRetailer[date][r] != null ? +(byDateRetailer[date][r] * 100).toFixed(1) : null]))
      }));
      return (
        <div className="chart-section">
          <div className="chart-title">Price per nappy (¢) over time</div>
          <ResponsiveContainer width="100%" height={160}>
            <LineChart data={chartData} margin={{ top: 4, right: 16, left: -16, bottom: 0 }}>
              <XAxis dataKey="date" tick={{ fontSize: 10, fill: "#444" }} tickLine={false} axisLine={false} />
              <YAxis tick={{ fontSize: 10, fill: "#444" }} tickLine={false} axisLine={false} tickFormatter={v => `${v}¢`} />
              <Tooltip contentStyle={{ background: "#fff", border: "1.5px solid #ede9fe", borderRadius: 12, fontSize: 12, fontFamily: "Nunito, sans-serif", fontWeight: 700, boxShadow: "0 4px 16px rgba(124,58,237,0.1)" }} labelStyle={{ color: "#a78bfa", marginBottom: 4 }} formatter={(v, name) => [`${v}¢`, name]} />
              <Legend wrapperStyle={{ fontSize: 10, paddingTop: 8 }} />
              {retailers.map(r => <Line key={r} type="monotone" dataKey={r} stroke={RETAILER_COLORS[r] || "#888"} strokeWidth={1.5} dot={false} connectNulls={false} />)}
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    }

    function ProductSection({ type, size, latest, history, scraping }) {
      const rows = latest.filter(r => r.product_type === type && r.size === size);
      const inStock = rows.filter(r => r.in_stock && r.price != null);
      const best = inStock.length ? inStock.reduce((a, b) => unitPrice(a.price, a.pack_count) < unitPrice(b.price, b.pack_count) ? a : b) : null;
      return (
        <div className="section">
          <div className="section-header">
            <span className={`section-badge ${type === "pants" ? "badge-pants" : "badge-nappies"}`}>{type === "pants" ? "Pull-up Pants" : "Nappies"}</span>
            <span className="section-title">Huggies Ultra Dry · Size {size}</span>
            {best && <div className="best-deal">Best: <strong>{fmtUnit(unitPrice(best.price, best.pack_count))}</strong><span style={{ color: "#555" }}>@ {best.retailer} ({best.pack_count}pk)</span></div>}
          </div>
          <PriceTable rows={rows} scraping={scraping} />
          <TrendChart history={history} productType={type} size={size} />
        </div>
      );
    }

    function App() {
      const [size, setSize] = useState(5);
      const [sizes, setSizes] = useState([5]);
      const [latest, setLatest] = useState([]);
      const [history, setHistory] = useState([]);
      const [variants, setVariants] = useState([]);
      const [scraping, setScraping] = useState(false);
      const [showAdd, setShowAdd] = useState(false);
      const [showConfig, setShowConfig] = useState(false);
      const [toast, setToast] = useState(null);
      const [lastScrape, setLastScrape] = useState(null);
      const [backendOk, setBackendOk] = useState(null);

      const showToast = (msg, type = "ok") => setToast({ msg, type });

      const loadData = useCallback(async () => {
        try {
          const [latestRes, historyRes, variantsRes] = await Promise.all([
            fetch(`${API}/prices/latest`),
            fetch(`${API}/prices/history?limit=300`),
            fetch(`${API}/variants`),
          ]);
          const [lat, hist, vars] = await Promise.all([latestRes.json(), historyRes.json(), variantsRes.json()]);
          setLatest(lat); setHistory(hist); setVariants(vars);
          setBackendOk(true);
          const allSizes = [...new Set(vars.map(v => v.size))].sort();
          setSizes(allSizes.length ? allSizes : [5]);
          if (!allSizes.includes(size) && allSizes.length) setSize(allSizes[0]);
        } catch {
          setBackendOk(false);
        }
      }, [size]);

      useEffect(() => { loadData(); }, []);

      const scrapeAll = async () => {
        setScraping(true);
        try {
          const res = await fetch(`${API}/scrape`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
          const results = await res.json();
          const errors = results.filter(r => r.error && r.error !== "URL not configured");
          setLastScrape(new Date());
          await loadData();
          if (errors.length) showToast(`${results.length - errors.length}/${results.length} scraped — ${errors.length} errors`, "error");
          else showToast(`All ${results.length} variants updated`);
        } catch { showToast("Scrape failed — check backend", "error"); }
        finally { setScraping(false); }
      };

      const addVariant = async (data) => {
        const res = await fetch(`${API}/variants`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        if (res.ok) { await loadData(); showToast("Variant added"); }
        else { const e = await res.json(); showToast(e.error || "Failed", "error"); }
      };

      const deleteVariant = async (id) => { await fetch(`${API}/variants/${id}`, { method: "DELETE" }); await loadData(); showToast("Removed"); };
      const updateVariant = async (id, data) => { await fetch(`${API}/variants/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }); await loadData(); showToast("Saved"); };

      return (
        <div className="app">
          <div className="header">
            <h1>Nappy Tracker</h1>
            <span className="sub">Huggies Ultra Dry · NZ</span>
            {lastScrape && <span className="sub" style={{ marginLeft: "auto" }}>refreshed {fmtDate(lastScrape.toISOString())}</span>}
          </div>

          {backendOk === false && (
            <div className="backend-banner">
              ⚠ Can't reach backend — start with <code style={{ color: "#aaa" }}>python3 app.py</code> on nosy box.
            </div>
          )}

          <div className="controls">
            <div className="size-tabs">
              {sizes.map(s => <button key={s} className={`size-tab ${size === s ? "active" : ""}`} onClick={() => setSize(s)}>Size {s}</button>)}
            </div>
            <div className="spacer" />
            <button className="btn" onClick={() => setShowAdd(true)}>+ Variant</button>
            <button className="btn" onClick={() => setShowConfig(true)}>Configure</button>
            <button className="btn primary" onClick={scrapeAll} disabled={scraping}>
              {scraping ? <><span className="dot-pulse" />Refreshing…</> : "↻ Refresh Prices"}
            </button>
          </div>

          <div className="product-sections">
            <ProductSection type="pants" size={size} latest={latest} history={history} scraping={scraping} />
            <ProductSection type="nappies" size={size} latest={latest} history={history} scraping={scraping} />
          </div>

          {showAdd && <AddVariantModal currentSize={size} onClose={() => setShowAdd(false)} onSave={addVariant} />}
          {showConfig && <ConfigModal variants={variants} onClose={() => setShowConfig(false)} onDelete={deleteVariant} onUpdate={updateVariant} />}
          {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
